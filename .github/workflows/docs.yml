name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check landing repository
        uses: actions/checkout@v4

      - name: Check core command registry
        uses: actions/checkout@v4
        with:
          repository: SiroSoft/siro-core
          path: siro-core

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation commands
        run: npm run check:docs
        env:
          SIRO_CORE_CONSOLE: ${{ github.workspace }}/siro-core/Console.php

      - name: Validate Core API examples
        run: npm run check:api
        env:
          SIRO_CORE_ROOT: ${{ github.workspace }}/siro-core

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
