<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SiroPHP feedback loop">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#05070d"/>
  <text x="60" y="64" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="24" font-weight="700">SiroPHP feedback loop</text>
  <text x="60" y="94" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Build → observe → replay in one terminal</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="150" width="300" height="120" rx="16" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="84" y="188" fill="#22d3ee" font-size="15" font-weight="700">1. Command</text>
    <text x="84" y="216" fill="#cbd5e1" font-size="14">php siro api:why GET /products</text>
    <text x="84" y="242" fill="#64748b" font-size="13">CRUD module generated + served</text>

    <rect x="450" y="150" width="300" height="120" rx="16" fill="#0b1220" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="474" y="188" fill="#a78bfa" font-size="15" font-weight="700">2. Trace</text>
    <text x="474" y="216" fill="#cbd5e1" font-size="14">routing · middleware · SQL</text>
    <text x="474" y="242" fill="#64748b" font-size="13">outbound HTTP · queued jobs</text>

    <rect x="840" y="150" width="300" height="120" rx="16" fill="#0b1220" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="864" y="188" fill="#34d399" font-size="15" font-weight="700">3. Replay</text>
    <text x="864" y="216" fill="#cbd5e1" font-size="14">php siro replay &lt;trace_id&gt;</text>
    <text x="864" y="242" fill="#64748b" font-size="13">side-effect check, then rerun</text>
    <path d="M370 210 H440" stroke="url(#g)" stroke-width="3" marker-end="url(#a)"/>
    <path d="M760 210 H830" stroke="url(#g)" stroke-width="3" marker-end="url(#a)"/>
    <text x="60" y="330" fill="#64748b" font-size="13">Same request context, every time — no guessing, no var_dump on production.</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22d3ee"/></marker></defs>
</svg>
